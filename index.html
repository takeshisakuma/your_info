<!DOCTYPE html>
<html lang="ja">
<head prefix="og: http://ogp.me/ns# fb: http://ogp.me/ns/fb# article: http://ogp.me/ns/article#">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="アクセスする端末の各種情報確認ができます。" />
  <meta property="og:title" content="Your Info">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://takeshisakuma.github.io/your_info/">
  <meta property="og:image" content="https://takeshisakuma.github.io/your_info/img/ogp.png">
  <meta property="og:description" content="アクセスする端末の各種情報確認ができます。">
  <link rel="canonical" href="https://takeshisakuma.github.io/your_info/" />
  <link rel="icon" href="/your_info/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/your_info/img/apple-touch-icon.png">
  <link rel="manifest" href="/your_info/manifest.webmanifest">
  <meta name="theme-color" content="#2c3e50">
  <title>Your Info</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>

</head>
<body>
  <div class="wrapper">
    <header>
      <div class="header--inner">
        <h1><a href="/your_info/">Your Info</a></h1>
      </div>
    </header>
    <main>
      <p class="lead">このページは、今開いているブラウザから見える端末の情報を表示します。</p>

      <section class="section">
        <h2>ブラウザ</h2>
        <div id="userBrowser"></div>
      </section>

      <section class="section">
        <h2>端末</h2>
        <div id="userDevice"></div>
      </section>

      <section class="section">
        <h2>画面</h2>
        <div id="userScreen"></div>
      </section>

      <section class="section">
        <h2>通信</h2>
        <p class="note">IPアドレスはインターネット接続のアドレスです。位置情報の緯度・経度とは別の値です。通信の実効タイプや速度はブラウザによる目安で、対応していないブラウザでは取得できません。</p>
        <div id="userNetwork"></div>
      </section>

      <section class="section">
        <h2>位置情報</h2>
        <p class="note">表示には位置情報の許可が必要です。緯度・経度は端末が測った位置です。</p>
        <div id="userPosition">位置情報を取得しています。</div>
      </section>

      <section class="section">
        <h2>センサー</h2>
        <p class="note">加速度や回転は、センサーのある端末で動きがあるときに更新されます。パソコンでは空になることが多いです。</p>
        <div id="userSensor">センサー情報を取得しています。</div>
      </section>
    </main>
    <footer>
      <div class="footer--inner">
        <address>Your Info</address>
      </div>
    </footer>
  </div>
</body>
</html>
